baseURL = 'https://go-plot.github.io/'
locale  = 'en-us'
title   = 'go-plot'
# No theme -- the layout is the go-* family template (go-fileshare.github.io's,
# via logos/landing-kit, as go-fft, go-ndarray and go-notebook use it): one
# self-contained layouts/index.html, partials/styles.html (the shared sheet,
# byte-identical) and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-plot: pure-Go (CGO=0) plotting for go-ndarray. matplotlib's object model and defaults, figures to SVG and PNG with real TeX labels, tested equal to matplotlib where they can be equal."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "plot"
  kind  = "library"
  href  = "https://github.com/go-plot/plot"
  blurb = "The library: <code>Figure</code>, <code>Axes</code> and every plot type, with <code>ticker</code> (tick locations and labels), <code>colors</code> (the cycle, eight colormaps, norms), <code>contour</code> (marching squares), <code>render</code> (raster and vector SVG back-ends) and <code>text</code> (DejaVu Sans, and TeX through go-tex/math)."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-plot.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): getting started, the API and why it has this shape, every plot type with the code that drew it, what is exact against matplotlib, TeX labels, performance, and the differences. <a href=\"https://github.com/go-plot/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-plot/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from go-plot/plot's docs/design.md at v0.1.0.
[[params.checks]]
  name = "Ticks, bit for bit"
  what = "Tick locations, labels and offset text on 408 axes of real figures (4 sizes, 37 linear and 14 log ranges): every location bit for bit, every label character for character."
[[params.checks]]
  name = "Locators and formatters"
  what = "45 MaxNLocator, 42 LogLocator, 72 ScalarFormatter and 25 LogFormatterSciNotation cases a default figure never reaches, exact."
[[params.checks]]
  name = "Eight colormaps"
  what = "viridis, plasma, inferno, magma, cividis, gray, coolwarm, RdBu (and `_r`): 1008 samples per map compared as floats and as bytes."
[[params.checks]]
  name = "Named colours and the cycle"
  what = "All 148 CSS4 colours, the 10 `tab:` colours, single letters, `C0`–`C9`, grey levels, short and long hex: exact."
[[params.checks]]
  name = "Layout, then TightLayout"
  what = "15 kinds of figure at two sizes: every Axes position and view limit to 1e-9 relative, every tick label exactly. After `TightLayout` (6 kinds at two sizes), every Axes edge within 0.005 of the figure."
[[params.checks]]
  name = "Pixels, side by side"
  what = "Twelve reference figures drawn by both put every axes frame and tick mark on the same pixel, and after `TightLayout` within 2 pixels; two deliberately shifted figures must fail, and do."

[params.brand]
# Generated by logos/landing-kit/kit.py from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.82:1, bright on the dark background 7.94:1.
  base = "#1f77b4"
  deep = "#13496e"
  bright = "#5aaee6"
  shadow = "rgba(31,119,180,.7)"
  glow = "rgba(31,119,180,.6)"
  wash = "rgba(31,119,180,.10)"
  washDeep = "rgba(19,73,110,.06)"
  chipBg = "#ebf5fc"
  chipBorder = "#cee7f8"
  chipFg = "#13496e"
  chipBgDark = "rgba(90,174,230,.14)"
  chipBorderDark = "rgba(90,174,230,.32)"
  chipFgDark = "#a4d2f1"
